---
Name: project-passwords
After: '#corepasswords'
---
# Keep the rule based validator (min. 8 characters, last 6 passwords not reusable)
# instead of the entropy based default of Silverstripe 5+
SilverStripe\Core\Injector\Injector:
  SilverStripe\Security\Validation\PasswordValidator:
    class: 'SilverStripe\Security\Validation\RulesPasswordValidator'
