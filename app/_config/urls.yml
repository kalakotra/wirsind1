---
Name: project-urls
After: '#canonicalurls'
---
# Keep the Silverstripe 4 URL behaviour: links end with a slash (templates build URLs
# like {$Link}details/$ID) and both /page and /page/ are served without a redirect.
SilverStripe\Control\Controller:
  add_trailing_slash: true
SilverStripe\Core\Injector\Injector:
  SilverStripe\Control\Middleware\CanonicalURLMiddleware:
    properties:
      EnforceTrailingSlashConfig: false
